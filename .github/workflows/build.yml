name: Build NEBULA ALARM APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking for an extracted Android project..."
          PROJECT_SETTINGS="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -not -path '*/build/*' | head -n 1 || true)"

          if [ -z "$PROJECT_SETTINGS" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname 'bulld.zip' | head -n 1 || true)"
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Tidak menemukan settings.gradle maupun bulld.zip. Upload file bulld.zip ke repository GitHub."
              echo "File yang ada di repository:"
              find . -maxdepth 3 -type f | sort | head -200
              exit 1
            fi
            echo "Found archive: $ZIP_FILE"
            mkdir -p _android_project
            unzip -oq "$ZIP_FILE" -d _android_project
            PROJECT_SETTINGS="$(find _android_project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 || true)"
          fi

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: bulld.zip tidak berisi settings.gradle."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Folder app tidak ditemukan di $PROJECT_DIR"
            ls -la "$PROJECT_DIR"
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project ready at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager was not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEBULA-ALARM-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
